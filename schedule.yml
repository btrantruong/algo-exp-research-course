# Calendar skeleton for the course site. One entry per event, sorted by date at build time.
# Lecture content (title, summary, materials, hide) lives in lectures/NN/lecture.yml,
# merged in by the `lecture:` number.
#
# Fields
#   date      ISO date (required)
#   end       ISO date, for multi-day bands such as independent work
#   type      intro | lecture | mentoring | presentation | break | independent
#             (deadline = a milestone-only date with no session)
#   title     the session, shown in the Session column (lecture rows take it from lecture.yml)
#   milestone a deadline or submission on this date, shown in the Milestone column
#   desc      optional one-line detail
#   note      optional short tag, e.g. "TBC"
#   lead      who leads the session; "/" for none
#   location  room | zoom   (default: room)
#   lecture   lecture number, links the row to lectures/NN/lecture.yml
#   group     rows sharing a group id collapse into one line of the syllabus table
#   focus     text of that syllabus line (set on the first row of a group)

rows:
