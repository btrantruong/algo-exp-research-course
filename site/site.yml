        links:
          # TODO: PAYWALLED (New Media & Society): get PDF or preprint, add url
          - label: "The daily dose of digital inspiration: A multi-method exploration of meaningful communication in social media (Rieger & Klimmt, 2018)"
            doi: 10.1177/1461444818788323
            note: "Access via Gdrive link (see announcement email)"
            abstract: "Research on eudaimonic media has so far predominantly focused on audiovisual offerings: movies or YouTube video clips. However, much meaningful and inspiring content nowadays is uploaded on social media in so-called memes. Three exploratory studies therefore investigated the occurrence, content, and effects of inspiring and meaningful memes in social media: The hashtags of eudaimonic memes were analyzed in semantic networks (study 1), a content analysis was conducted to typologize eudaimonic themes addressed in memes (study 2), and an online survey investigated the effects of eudaimonic memes on users (study 3). The results suggest that previously defined topics of inspiration and meaningfulness are also common among hashtags and memes and lead to the same beneficial effects for their consumers. The discussion aims at advancing the theory of mediated eudaimonia and understanding its relevance for well-being in the daily lives of social media users."
          - label: "How effective are TikTok misinformation debunking videos? (Bhargava et al., 2023)"
            doi: 10.37016/mr-2020-114
            url: https://doi.org/10.37016/mr-2020-114
            abstract: "TikTok provides opportunity for citizen-led debunking where users correct other users’ misinformation. In the present study (N=1,169), participants either watched and rated the credibility of (1) a misinformation video, (2) a correction video, or (3) a misinformation video followed by a correction video (“debunking”). Afterwards, participants rated both a factual and a misinformation video about the same topic and judged the accuracy of the claim furthered by the misinformation video. We found modest evidence for the effectiveness of debunking on people’s ability to subsequently discern between true and false videos, but stronger evidence on subsequent belief in the false claim itself."
          # TODO: PAYWALLED (Journal of Communication): get PDF or preprint, add url
          - label: "Instagram Inspiration: How Upward Comparison on Social Network Sites Can Contribute to Well-Being (Meier, Gilbert, Börner & Possler, 2020)"
            doi: 10.1093/joc/jqaa025
            url: https://academic.oup.com/joc/article/70/5/721/5900861
            abstract: "Passive exposure to others’ positive self-presentations on social network sites (SNS) such as Instagram has been repeatedly associated with reduced well-being, particularly by triggering upward social comparison and envy. However, prior research has largely neglected that upward comparisons on SNS may also facilitate positive outcomes, specifically media-induced inspiration, a motivational state highly conducive to well-being. We conducted two experiments that tested whether and how cognitive-affective processing of visual SNS postings results in inspiration. Study 1 (N = 270) provides first evidence that users react to more positive, optimized Instagram nature and travel posts with stronger upward comparison, which facilitates inspiration via an assimilative emotional reaction (benign envy), thus enhancing well-being. The preregistered Study 2 (N = 408) replicates these findings. Overall, results indicate that users can be inspired from comparing upwards on SNS, which may briefly improve their well-being. We discuss boundary conditions and implications for future communication research."
          # TODO: Publisher version paywalled (Oxford); linked free author copy from MPI
          - label: "Normative Change and Culture of Hate: An Experiment in Online Environments (Álvarez-Benjumea & Winter, 2018)"
            doi: 10.1093/esr/jcy005
            url: https://www.coll.mpg.de/pdf_dat/2018_03online.pdf
            abstract: "We present an online experiment in which we investigate the impact of perceived social acceptability on online hate speech, and measure the causal effect of specific interventions. We compare two types of interventions: counter-speaking (informal verbal sanctions) and censoring (deleting hateful content). The interventions are based on the belief that individuals infer acceptability from the context, using previous actions as a source of normative information. The interventions are based on the two conceptualizations found in the literature: (i) what do others normally do, i.e. descriptive norms; and (ii) what happened to those who violated the norm, i.e. injunctive norms. Participants were significantly less likely to engage in hate speech when prior hate content had been moderately censored. Our results suggest that norm adherence in online conversations might, in fact, be motivated by descriptive norms rather than injunctive norms. With this work we present some of the first experimental evidence investigating the social determinants of hate speech in online communities. The results could advance the understanding of the micro-mechanisms that regulate hate speech. Also, such findings can guide future interventions in online communities that help prevent the spread of hate."
          - label: "Psychological inoculation improves resilience against misinformation on social media (Roozenbeek et al., 2022)"
            doi: 10.1126/sciadv.abo6254
            url: https://doi.org/10.1126/sciadv.abo6254
            abstract: "Online misinformation continues to have adverse consequences for society. Inoculation theory has been put forward as a way to reduce susceptibility to misinformation by informing people about how they might be misinformed, but its scalability has been elusive both at a theoretical level and a practical level. We developed five short videos that inoculate people against manipulation techniques commonly used in misinformation: emotionally manipulative language, incoherence, false dichotomies, scapegoating, and ad hominem attacks. In seven preregistered studies, i.e., six randomized controlled studies ( n = 6464) and an ecologically valid field study on YouTube ( n = 22,632), we find that these videos improve manipulation technique recognition, boost confidence in spotting these techniques, increase people’s ability to discern trustworthy from untrustworthy content, and improve the quality of their sharing decisions. These effects are robust across the political spectrum and a wide variety of covariates. We show that psychological inoculation campaigns on social media are effective at improving misinformation resilience at scale."
          # TODO: Science version paywalled; linked arXiv preprint
          - label: "Reranking partisan animosity in algorithmic social media feeds alters affective polarization (Piccardi et al., 2025)"
            doi: 10.1126/science.adu5584
            note: "Access via Gdrive link (see announcement email)"
            abstract: "Today, social media platforms hold the sole power to study the effects of feed-ranking algorithms. We developed a platform-independent method that reranks participants' feeds in real time and used this method to conduct a preregistered 10-day field experiment with 1256 participants on X during the 2024 US presidential campaign. Our experiment used a large language model to rerank posts that expressed antidemocratic attitudes and partisan animosity (AAPA). Decreasing or increasing AAPA exposure shifted out-party partisan animosity by more than 2 points on a 100-point feeling thermometer, with no detectable differences across party lines, providing causal evidence that exposure to AAPA content alters affective polarization. This work establishes a method to study feed algorithms without requiring platform cooperation, enabling independent evaluation of ranking interventions in naturalistic settings."
          # TODO: Publisher version paywalled (Taylor & Francis); linked Zenodo author copy
          - label: "Sharing beyond Slacktivism: the effect of socially observable prosocial media sharing on subsequent offline helping behavior (Lane & Dal Cin, 2017)"
            doi: 10.1080/1369118X.2017.1340496
            note: "Access via Gdrive link (see announcement email)"
            abstract: "New forms of youth social and political participation have been termed ‘Slacktivism’ – low-cost online forms of social engagement that decrease subsequent offline participation. Previous experimental work has provided support for a ‘Slacktivism effect,’ but it is unclear if this theoretical model applies to youth media sharing on social networking sites. This study uses a novel sharing simulation paradigm to test the effect of publicly vs. anonymously sharing a social cause video on subsequent willingness to engage in offline helping behavior. Results show that publicly (as compared to anonymously) sharing a selected video on one’s own Facebook wall led to a greater willingness to volunteer for an issue-related cause. Participants’ existing use of social media for engagement in social issues/causes moderated the effect, such that only participants low in use of social media for social engagement were susceptible to the sharing manipulation. Implications for reconceptualizing media sharing as a unique form of online participation beyond ‘Slacktivism’ are discussed."
          - label: "Simple changes to content curation algorithms affect the beliefs people form in a collaborative filtering experiment (Burton, Herzog & Lorenz-Spreen, 2026)"
            doi: 10.1145/3772318.3790602
            url: https://doi.org/10.1145/3772318.3790602
            abstract: "Content-curating algorithms provide a crucial service for social media users by surfacing relevant content, but they can also bring about harms when their objectives are misaligned with user values and welfare. Yet, potential behavioral consequences of this alignment problem remain understudied in controlled experiments. In a preregistered, two-wave, collaborative filtering experiment, we demonstrate that small changes to the metrics used for sampling and ranking posts affect the beliefs people form. Our results show observable differences in two types of outcomes within statisticized groups: belief accuracy and consensus. We find partial support for hypotheses that the recently proposed approaches of \"bridging-based ranking\" and \"intelligence-based ranking\" promote consensus and belief accuracy, respectively. We also find that while personalized, engagement-based ranking promotes posts that participants perceive favorably, it simultaneously leads those participants to form more polarized and less accurate beliefs than any of the other algorithms considered."
          # TODO: ABSTRACT MISSING: published abstract could not be verified; paste from PsycNET. Check the DOI link opens full text
          - label: "Social identity shapes antecedents and functional outcomes of moral emotion expression (Brady & Van Bavel, 2025)"
            doi: 10.1037/xge0001753
            note: "Access via Gdrive link (see announcement email)"
            abstract: "There is increasing evidence that moral and emotional rhetoric spreads widely on social media and is associated with intergroup conflict, polarization, and the spread of misinformation. However, this literature is largely correlational, making it unclear why moral and emotional content drives sharing and conflict. In this research, we examine the causal impact of moral–emotional content on sharing decisions and how social identity shapes the antecedents and functional outcomes of decisions to share. Across five preregistered experiments (N = 2,498), we find robust evidence that the inclusion of moral–emotional expressions in political messages increases intentions to share the messages on social media. Moreover, individual differences in the strength of partisan identification and ideological extremity are robust predictors of sharing messages with moral–emotional expressions, even when accounting for attitude strength. However, we only found mixed evidence that brief manipulations of identity salience increased sharing. In terms of functional outcomes, when partisans choose to share messages with moral–emotional language, people perceive them as more strongly identified among their partisan ingroup but less open minded and less worthy of conversation with outgroup members. These experiments highlight the causal role of moral–emotional expression in online sharing intentions and how such expressions in online networks can serve ingroup reputation functions while hindering discourse between political groups"
          - label: "Toxic Speech and Limited Demand for Content Moderation on Social Media (Pradel, Zilinsky, Kosmidis & Theocharis, 2024)"
            doi: 10.1017/S000305542300134X
            url: https://doi.org/10.1017/S000305542300134X
            abstract: "When is speech on social media toxic enough to warrant content moderation? Platforms impose limits on what can be posted online, but also rely on users’ reports of potentially harmful content. Yet we know little about what users consider inadmissible to public discourse and what measures they wish to see implemented. Building on past work, we conceptualize three variants of toxic speech: incivility, intolerance, and violent threats. We present results from two studies with pre-registered randomized experiments (Study 1, N = 5,130 ; Study 2, N = 3,734 ) to examine how these variants causally affect users’ content moderation preferences. We find that while both the severity of toxicity and the target of the attack matter, the demand for content moderation of toxic speech is limited. We discuss implications for the study of toxicity and content moderation as an emerging area of research in political science with critical implications for platforms, policymakers, and democracy more broadly."
          # TODO: PAYWALLED (Political Studies Review): get PDF or a preprint (OSF project https://osf.io/angxy), add url
          - label: "What Is the Effect of Political Influencers on TikTok? Early Results From a Field Experiment With Young Adults (Alsharawy, Anstett & Landgrave, 2025)"
            doi: 10.1177/14789299251323741
            note: "Access via Gdrive link (see announcement email)"
            abstract: "Politicians from both major political parties in the United States have been raising concerns about the rise of TikTok, a popular social media platform founded by Chinese entrepreneurs, with some calling for stricter regulation or even banning the platform. One aspect of opposition to TikTok is its growth as a news source among young adults. This is concerning because TikTok relies on short videos that can spur strong emotional responses in young adults who are still undergoing substantial cognitive development. To test the effect of watching TikTok political influencers on young adults’ emotional response and political attitudes, we conducted a field experiment at a large American public university. Using survey data and video content analysis, we found that consuming political content on TikTok increased negative emotional affect but had seemingly no effect on political attitudes. We urge further studies to verify the negative effect of TikTok on emotional affect and to test potential mitigating interventions to reduce this adverse effect. While we strongly urge further study, we advise policymakers to place additional scrutiny on the effect of social media platforms like TikTok on emotional wellbeing."
          # TODO: PAYWALLED (Journal of Communication): get PDF or preprint, add url
          - label: "YouTube for Good: A Content Analysis and Examination of Elicitors of Self-Transcendent Media (Dale, Raney, Janicke-Bowles, Sanders & Oliver, 2017)"
            doi: 10.1111/jcom.12333
            abstract: "Despite the increased attention to eudaimonic media experiences, to date scholars have paid little attention to the specific portrayals responsible for those experiences. Study 1 of this project reports the first systematic content analysis of self-transcendent media—a particular type of eudaimonic media—using a sample of 100 “inspirational” YouTube videos. The presence of 20 specific elicitors associated with self-transcendent emotions was examined and reported. In Study 2, respondents provided real-time self-transcendent emotional reactions while viewing 3 “inspirational” videos. As expected, ratings significantly increased immediately following exposure to each specific elicitor. Thus, this project reports the first empirical evidence directly linking specific representations to content identified as “inspirational” and directly linking those representations to self-transcendent emotional reactions."
